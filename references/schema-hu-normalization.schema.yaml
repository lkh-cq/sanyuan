# Hu Normalization Schema
# 互信息归一化结果 H_T — lossless relation alignment view

$schema: "https://json-schema.org/draft-07/schema#"
title: MutualView
description: "互信息任务视图: 只做关系保真对齐与标注，不包含默认 omitted/delete/loss 权限。"

type: object
required:
  - representation_id
  - boundary_id
  - observation_system
  - axes
  - route_code
  - relation_refs
  - aligned_relations
  - unresolved_relations
  - coverage
  - valid

properties:
  representation_id:
    type: string
    pattern: "^ht_[A-Za-z0-9._:-]+$"

  boundary_id:
    type: string

  observation_system:
    type: string
    enum: [hu]

  origin:
    type: string

  axes:
    type: array
    items:
      type: string
      enum: [direct, composite, path_residual, flow, stop, filter, transform, buffer, feedback]
    minItems: 1

  route_code:
    type: string
    description: "离散路由码 q_H；只用于路由提示"

  continuous_signal:
    type: object
    properties:
      direction:
        type: number
        minimum: 0
        maximum: 1
      condition:
        type: number
        minimum: 0
        maximum: 1
      strength:
        type: number
        minimum: 0
        maximum: 1
      temporal:
        type: number
        minimum: 0
        maximum: 1
    additionalProperties: false

  relation_refs:
    type: array
    minItems: 1
    uniqueItems: true
    items:
      type: string

  aligned_relations:
    type: array
    items:
      type: object
      required: [relation_ref, endpoint_refs, relation_type, source_ref]
      properties:
        relation_ref:
          type: string
        endpoint_refs:
          type: array
          minItems: 2
          items:
            type: string
        relation_type:
          type: string
        conditions:
          type: array
          items:
            type: string
        source_ref:
          type: string
      additionalProperties: true

  unresolved_relations:
    type: array
    description: "无法完成对齐的关系必须显式保留，而不是 omitted"
    items:
      type: object
      required: [relation_ref, source_ref, reason]
      properties:
        relation_ref:
          type: string
        source_ref:
          type: string
        reason:
          type: string
      additionalProperties: false

  path_residual_refs:
    type: array
    items:
      type: string

  coverage:
    type: object
    required: [relations_in, relations_traceable_out]
    properties:
      relations_in:
        type: integer
        minimum: 0
      relations_traceable_out:
        type: integer
        minimum: 0
    additionalProperties: false

  valid:
    type: boolean

additionalProperties: false
