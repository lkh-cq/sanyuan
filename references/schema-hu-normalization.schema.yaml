# Hu Normalization Schema
# 互信息归一化结果 H_T

$schema: "https://json-schema.org/draft-07/schema#"
title: MutualView
description: "互信息任务视图: 互信息空间独立归一化结果"

type: object
required:
  - representation_id
  - boundary_id
  - observation_system
  - axes
  - route_code
  - endpoint_refs
  - relation_type
  - direct_or_composite
  - preserved_features
  - omitted_features
  - recovery_refs
  - loss
  - valid

properties:
  representation_id:
    type: string
    pattern: "^ht_\\d{8}_\\d{3}$"

  boundary_id:
    type: string

  observation_system:
    type: string
    enum: [hu]

  origin:
    type: string

  axes:
    type: array
    items:
      type: string
      enum: [direct, composite, path_residual, flow, stop, filter, transform, buffer, feedback]
    minItems: 1

  route_code:
    type: string
    description: "离散路由码 q_H"

  continuous_signal:
    type: object
    properties:
      direction:
        type: number
        minimum: 0
        maximum: 1
      condition:
        type: number
        minimum: 0
        maximum: 1
      strength:
        type: number
        minimum: 0
        maximum: 1
      temporal:
        type: number
        minimum: 0
        maximum: 1

  endpoint_refs:
    type: array
    description: "关系端点引用"
    items:
      type: string
    minItems: 2

  relation_type:
    type: string
    enum: [direct, composite, flow_event, transform, feedback, conditional, temporal, observational, task, path_residual]

  direct_or_composite:
    type: string
    enum: [direct, composite]

  path_refs:
    type: array
    description: "复合互路径引用"
    items:
      type: string

  path_residual:
    type:
      - string
      - "null"
    description: "路径残差"

  residual_features:
    type: array
    description: "路径残差特征(特殊保护, 不可删除)"
    items:
      type: string

  conditions:
    type: array
    items:
      type: string

  strength:
    type: number
    minimum: 0
    maximum: 1

  preserved_features:
    type: array
    items:
      type: string

  omitted_features:
    type: array
    items:
      type: string

  recovery_refs:
    type: array
    items:
      type: string

  loss:
    type: object
    required: [structural, functional]
    properties:
      structural:
        type: number
        minimum: 0
        maximum: 1
      functional:
        type: number
        minimum: 0
        maximum: 1

  valid:
    type: boolean
