project:
  id: consciousness-bus
  name: 意识总线
  version: 3.2.1

version_policy:
  project_version_source: references/project-manifest.yaml#project.version
  project_tag_format: "v<project.version>"
  module_versions_are_independent: true
  same_project_version_must_not_move_between_commits: true

lifecycle_definitions:
  frozen: "冻结本体或权威边界；修改必须完成全链迁移。"
  stable: "已进入当前运行链并通过结构与行为验证。"
  experimental: "接口已登记，但证据、权重或使用经验仍不足。"
  source: "保存设计来源与原始锚点，不直接作为运行时事实。"

module_lifecycle:
  frozen:
    - root-architecture
  stable:
    - core-rho-convergence
    - core-theta-switching
    - core-deep-conscious
    - core-cache-wave-dynamics
    - core-condense-protocol
    - preprocessor-task-boundary
    - preprocessor-meta-normalization
    - preprocessor-hu-normalization
    - preprocessor-think-before-responding
    - preprocessor-task-decomposition
    - branch-zang-gui
    - extension-archive-ingestion
    - extension-reading-topology
    - extension-reader-facing-analysis
    - extension-modality-boundary
    - validation-framework-pitfalls
  experimental:
    - extension-yijing-coupling-matrix
  source:
    - source-original-anchors
    - source-sanyuan-daobian

entrypoints:
  root: SKILL.md
  research: references/research-recipe.yaml
  fast_filter: references/fast-filter-recipe.yaml

authority:
  architecture:
    path: references/architecture.md
    module_id: root-architecture

core:
  conscious:
    id: conscious-rho
    name: ρ收束
    path: references/rho-convergence.md
    version: 3.0.0
    module_id: core-rho-convergence

  unconscious:
    id: unconscious-theta
    name: θ切换
    path: references/theta-switching.md
    version: 1.4.0
    module_id: core-theta-switching
    depends_on:
      - conscious-rho

  deep_conscious:
    id: deep-conscious
    name: n位聚焦
    path: references/n-focus.md
    version: 3.0.0
    module_id: core-deep-conscious
    depends_on:
      - conscious-rho
      - unconscious-theta
      - cache-wave

  cache_wave:
    id: cache-wave
    name: 缓存波动力学
    path: references/cache-wave.md
    version: 1.0.0
    module_id: core-cache-wave-dynamics

  condense:
    id: condense
    name: condense协议
    path: references/condense-protocol.md
    version: 0.2.0
    module_id: core-condense-protocol

preprocessors:
  task_boundary:
    id: task-boundary-compiler
    name: 任务边界编译
    path: references/task-boundary.md
    version: 0.1.0
    module_id: preprocessor-task-boundary

  meta_normalization:
    id: meta-normalization
    name: 元归一化
    path: references/meta-normalization.md
    version: 0.1.0
    module_id: preprocessor-meta-normalization
    depends_on:
      - task-boundary-compiler

  hu_normalization:
    id: hu-normalization
    name: 互归一化
    path: references/hu-normalization.md
    version: 0.1.0
    module_id: preprocessor-hu-normalization
    depends_on:
      - task-boundary-compiler

  think_before_responding:
    id: think-before-responding
    name: 三思而后行
    path: references/think-before-responding.md
    version: 0.3.0
    module_id: preprocessor-think-before-responding
    depends_on:
      - conscious-rho
      - unconscious-theta

  task_decomposition:
    id: task-decomposition
    name: 子任务拆分
    path: references/task-decomposition.md
    version: 0.3.0
    module_id: preprocessor-task-decomposition

observation_spaces:
  meta:
    id: meta-observation-space
    encoder: references/sancai-store.md
    normalizer: references/meta-normalization.md
    mandatory: true

  hu:
    id: hu-observation-space
    path: references/hu-observation-space.md
    normalizer: references/hu-normalization.md
    mandatory: true

  supplementary:
    mandatory: false
    selectable:
      - time
      - evidence
      - source
      - uncertainty
      - risk
      - execution
      - history

branches:
  zang_gui:
    entrypoint: references/zang-gui-orchestrator.md
    id: zang-gui-orchestrator
    version: 0.3.0
    module_id: branch-zang-gui
    sub_modules:
      sancai_store:
        path: references/sancai-store.md
      tiancai:
        path: references/tiancai.md
      dicai:
        path: references/dicai.md
      rencai:
        path: references/rencai.md
      write_spec:
        path: references/store-write-spec.md
      santi_read:
        path: references/santi-read.md
      tianti:
        path: references/tianti.md
      diti:
        path: references/diti.md
      renti:
        path: references/renti.md
      read_inject:
        path: references/read-injection.md
      topology:
        path: references/flow-topology.md
      flow_event_catalog:
        path: references/flow-event-catalog.yaml
      cycle:
        path: references/zang-gui-cycle.md

recipes:
  research:
    path: references/research-recipe.yaml
  fast_filter:
    path: references/fast-filter-recipe.yaml

storage:
  root: reference/
  source: reference/source/
  store: reference/store/
  read: reference/read/
  flow: reference/flow/
  routing: reference/routing/

schemas:
  state_protocol: references/state-protocol.schema.yaml
  attention_state: references/schema-attention-state.schema.yaml
  store_node: references/schema-store-node.schema.yaml
  read_node: references/schema-read-node.schema.yaml
  mutual_node: references/schema-mutual-node.schema.yaml
  coupling_state: references/schema-coupling-state.schema.yaml
  flow_event: references/schema-flow-event.schema.yaml
  cycle_link: references/schema-cycle-link.schema.yaml
  recipe: references/schema-recipe.schema.yaml
  task_boundary: references/schema-task-boundary.schema.yaml
  meta_normalization: references/schema-meta-normalization.schema.yaml
  hu_normalization: references/schema-hu-normalization.schema.yaml

sources:
  original_anchors:
    path: references/original-anchors.md
    version: 0.1.0
    module_id: source-original-anchors
  sanyuan_daobian:
    path: references/sanyuan-daobian-framework.md
    version: 0.1.0
    module_id: source-sanyuan-daobian

extensions:
  archive_ingestion:
    id: archive-ingestion
    name: 归档方案迁移协议
    path: references/archive-ingestion.md
    version: 0.1.0
    module_id: extension-archive-ingestion
  reading_topology:
    id: reading-topology
    name: 三元语法阅读拓扑
    path: references/reading-topology.md
    version: 0.2.0
    module_id: extension-reading-topology
  reader_facing_analysis:
    id: reader-facing-analysis
    name: 读者端分析交付
    path: references/reader-facing-analysis.md
    version: 0.1.0
    module_id: extension-reader-facing-analysis
    depends_on:
      - reading-topology
  modality_boundary:
    id: modality-boundary
    name: 模态可见性边界
    path: references/modality-boundary.md
    version: 0.1.0
    module_id: extension-modality-boundary
  yijing_coupling_matrix:
    id: yijing-coupling-matrix
    name: 易经耦合矩阵接口
    path: references/yijing-coupling-matrix.md
    version: 0.1.0
    module_id: extension-yijing-coupling-matrix

validation:
  output_contract: references/output-contract.md
  acceptance_cases: references/acceptance-tests.yaml
  framework_pitfalls:
    path: references/framework-pitfalls.md
    version: 0.1.0
    module_id: validation-framework-pitfalls
  bundle_validator: scripts/validate_bundle.py
  ci_workflow: .github/workflows/validate.yml

canvas:
  total: assets/canvas/意识总线_总架构.canvas
  sancai: assets/canvas/藏_三才.canvas
  santi: assets/canvas/归_三题.canvas
  flow: assets/canvas/运行时流止.canvas
  meta_hu: assets/canvas/元互双空间.canvas

archive:
  provenance: references/version-provenance.md
  runtime_included: false
