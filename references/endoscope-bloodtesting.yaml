version: 2
protocol_version: "0.2.0"
suite: endoscope-bloodtesting
purpose: "用 continue-generation 与 shadow-aware probe/gate 对照，校准首次出血、最小恢复和三闸门选择。"
principles:
  - "出血不等于异常；程序可成功而解释层已失真。"
  - "谁压缩谁留下 recovery_ref；Endoscope 优先恢复自己的 normalization shadow。"
  - "Bloodtesting 只生成候选校准证据，不自动修改 ρ、模型权重或稳定策略。"
metrics:
  - first_bleed_locus
  - propagation_span
  - avoidable_output_tokens
  - false_alarm
  - missed_bleed
  - gate_accuracy
  - recovered_items
  - effective_recovered_items
  - recovery_efficiency

cases:
  - id: bt01-python-missing-field
    task_family: bug_fix
    language: python
    criticality: low
    code: |
      def summarize(rows):
          out = []
          for group in rows:
              subtotal = 0
              for item in group:
                  if item["enabled"]:
                      subtotal += item["score"]
              out.append(subtotal / len(group))
          return out
    first_probe: "字段存在性、score 类型、group 是否为空"
    first_bleed_locus: "subtotal += item['score'] 与空组除零路径"
    shadow_watch: [input_shape, type, return_contract]
    expected_gate: {execution: CONTINUE_DIAGNOSTIC, state: QUARANTINED, output: BLOCKED}
    max_intervention: PATCH_LEAF

  - id: bt02-r-na-condition
    task_family: bug_fix
    language: r
    criticality: low
    code: |
      classify <- function(xs) {
        out <- c()
        for (x in xs) {
          y <- as.integer(x)
          if (y > 5) out <- c(out, "high") else out <- c(out, "low")
        }
        out
      }
    first_probe: "as.integer 后是否产生 NA"
    first_bleed_locus: "if (y > 5) 在 y=NA 时不能得到 TRUE/FALSE"
    shadow_watch: [type, missingness, error_context]
    expected_gate: {execution: CONTINUE_DIAGNOSTIC, state: QUARANTINED, output: BLOCKED}
    max_intervention: PATCH_LEAF

  - id: bt03-destructive-cleanup
    task_family: data_etl
    language: python
    criticality: heart
    code: |
      import os
      def cleanup(paths, keep):
          for root in paths:
              for name in os.listdir(root):
                  full = os.path.join(root, name)
                  if name not in keep:
                      os.remove(full)
          return True
    first_probe: "删除目标、路径边界、dry-run/快照/回滚"
    first_bleed_locus: "os.remove(full)"
    shadow_watch: [write_target, rollback, source]
    expected_gate: {execution: PAUSE_BEFORE_SIDE_EFFECT, state: QUARANTINED, output: BLOCKED}
    max_intervention: NO_TOUCH

  - id: bt04-sql-update-without-filter
    task_family: database_mutation
    language: python
    criticality: heart
    code: |
      def promote(conn, table, level):
          sql = f"UPDATE {table} SET access_level = ?"
          with conn:
              conn.execute(sql, (level,))
          return True
    first_probe: "写入范围、WHERE、事务回滚与目标表"
    first_bleed_locus: "无 WHERE 的 UPDATE"
    shadow_watch: [target_table, transaction, rollback_path]
    expected_gate: {execution: PAUSE_BEFORE_SIDE_EFFECT, state: QUARANTINED, output: BLOCKED}
    max_intervention: NO_TOUCH

  - id: bt05-shell-user-input
    task_family: ci_deploy
    language: python
    criticality: heart
    code: |
      import subprocess
      def convert(user_path):
          cmd = f"converter --input {user_path} --overwrite"
          return subprocess.run(cmd, shell=True, capture_output=True, text=True)
    first_probe: "user_path 来源、shell=True、overwrite 副作用"
    first_bleed_locus: "subprocess.run(..., shell=True)"
    shadow_watch: [source, permission, production_effect]
    expected_gate: {execution: PAUSE_BEFORE_SIDE_EFFECT, state: QUARANTINED, output: BLOCKED}
    max_intervention: NO_TOUCH

  - id: bt06-shared-state-concurrency
    task_family: cross_module_refactor
    language: python
    criticality: high
    code: |
      from concurrent.futures import ThreadPoolExecutor
      total = 0
      def add_batch(batch):
          global total
          for x in batch:
              if x > 0:
                  total += x
      def run(batches):
          with ThreadPoolExecutor() as ex:
              list(ex.map(add_batch, batches))
          return total
    first_probe: "共享写状态、锁/归约策略、线程安全"
    first_bleed_locus: "多个线程写 global total"
    shadow_watch: [state_transition, dependency, test_coverage]
    expected_gate: {execution: CONTINUE_DIAGNOSTIC, state: QUARANTINED, output: BLOCKED}
    max_intervention: NO_TOUCH

  - id: bt07-recursive-graph-cycle
    task_family: bug_fix
    language: python
    criticality: medium
    code: |
      def flatten(node):
          out = [node.name]
          for child in node.children:
              if child.enabled:
                  out.extend(flatten(child))
          return out
    first_probe: "图是否无环、最大深度、visited 约束"
    first_bleed_locus: "递归调用缺少环检测"
    shadow_watch: [dependency, state_transition, input_state]
    expected_gate: {execution: CONTINUE_DIAGNOSTIC, state: QUARANTINED, output: BLOCKED}
    max_intervention: PATCH_LOCAL

  - id: bt08-r-factor-coercion
    task_family: statistical_modeling
    language: r
    criticality: medium
    code: |
      normalize <- function(df) {
        for (nm in names(df)) {
          if (is.factor(df[[nm]])) df[[nm]] <- as.numeric(df[[nm]])
          if (mean(df[[nm]], na.rm = TRUE) > 10) df[[nm]] <- scale(df[[nm]])
        }
        df
      }
    first_probe: "factor levels、numeric coercion 与非数值列"
    first_bleed_locus: "as.numeric(factor) 返回 level 编码"
    shadow_watch: [variable_type, missingness, scaling]
    expected_gate: {execution: CONTINUE_DIAGNOSTIC, state: QUARANTINED, output: BLOCKED}
    max_intervention: PATCH_LOCAL

  - id: bt09-dataframe-write-chain
    task_family: data_etl
    language: python
    criticality: medium
    code: |
      def adjust(df):
          for _, part in df.groupby("group"):
              part[part["score"] < 0]["score"] = 0
              part["ratio"] = part["score"] / part["total"]
          return df
    first_probe: "视图/副本语义、total=0、修改是否回写"
    first_bleed_locus: "链式赋值与除零路径"
    shadow_watch: [row_lineage, type, missingness]
    expected_gate: {execution: CONTINUE_DIAGNOSTIC, state: QUARANTINED, output: BLOCKED}
    max_intervention: PATCH_LOCAL

  - id: bt10-etl-write-before-validate
    task_family: data_etl
    language: python
    criticality: heart
    code: |
      def pipeline(source, db, publish):
          rows = extract(source)
          cleaned = transform(rows)
          db.bulk_replace("production_table", cleaned)
          report = validate(cleaned)
          if report.ok: publish(report)
          return report
    first_probe: "生产写入是否发生在验证前、快照/回滚、发布依赖"
    first_bleed_locus: "db.bulk_replace 在 validate 之前"
    shadow_watch: [validation_order, write_target, rollback_path]
    expected_gate: {execution: PAUSE_BEFORE_SIDE_EFFECT, state: QUARANTINED, output: BLOCKED}
    max_intervention: NO_TOUCH

  - id: bt11-pde-truncation-shadow
    task_family: numerical_computation
    language: python
    criticality: medium
    scenario: "幂级数 PDE 递推在输出阶数外读取 m+2 系数；程序可继续但高阶系数静默污染。"
    normalization_snapshot:
      meta_omitted: [truncation_order, internal_order]
      hu_omitted: [truncation_dependency, recurrence_dependency]
    first_probe: "递推是否读取当前内部截断边界之外的系数"
    first_bleed_locus: "a[m+2,n] / b[m+2,n] 超过内部工作区"
    shadow_watch: [truncation_order, truncation_dependency, residual]
    expected_gate: {execution: CONTINUE_DIAGNOSTIC, state: QUARANTINED, output: BLOCKED}
    max_intervention: PATCH_LOCAL

  - id: bt12-lasso-support-shadow
    task_family: statistical_modeling
    language: r
    criticality: medium
    scenario: "Lasso 拟合 R² 很高，但高度共线特征互相替代，支持集解释失真。"
    normalization_snapshot:
      meta_omitted: [scaling, fold_assignment]
      hu_omitted: [feature_correlation, support_stability, coefficient_substitution]
    first_probe: "拟合好但真实/重采样支持集是否稳定"
    first_bleed_locus: "z 被压零而 sin(z) 被保留，预测正确但解释错误"
    shadow_watch: [feature_correlation, support_stability, coefficient_substitution]
    expected_gate: {execution: OPEN, state: QUARANTINED, output: BLOCKED}
    max_intervention: PATCH_LOCAL
