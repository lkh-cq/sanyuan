# Meta Normalization Schema
# 元信息归一化结果 M_T — lossless alignment view

$schema: "https://json-schema.org/draft-07/schema#"
title: MetaView
description: "元信息任务视图: 只做保真对齐与标注，不包含默认 omitted/delete/loss 权限。"

type: object
required:
  - representation_id
  - boundary_id
  - observation_system
  - axes
  - route_code
  - continuous_signal
  - source_item_refs
  - aligned_features
  - unmapped_features
  - coverage
  - valid

properties:
  representation_id:
    type: string
    pattern: "^mt_[A-Za-z0-9._:-]+$"

  boundary_id:
    type: string

  observation_system:
    type: string
    enum: [meta]

  origin:
    type: string

  axes:
    type: array
    items:
      type: string
      enum: [tiancai, dicai, rencai]
    minItems: 1

  route_code:
    type: string
    description: "离散路由码 q_M；只用于路由提示"

  continuous_signal:
    type: object
    properties:
      tiancai:
        type: number
        minimum: 0
        maximum: 1
      dicai:
        type: number
        minimum: 0
        maximum: 1
      rencai:
        type: number
        minimum: 0
        maximum: 1
    additionalProperties: false

  source_item_refs:
    type: array
    minItems: 1
    uniqueItems: true
    items:
      type: string

  source_node_refs:
    type: array
    items:
      type: string

  aligned_features:
    type: array
    items:
      type: object
      required: [feature_ref, source_ref]
      properties:
        feature_ref:
          type: string
        source_ref:
          type: string
        normalized_label:
          type: [string, "null"]
      additionalProperties: true

  unmapped_features:
    type: array
    description: "无法完成对齐的特征必须显式保留，而不是 omitted"
    items:
      type: object
      required: [feature_ref, source_ref, reason]
      properties:
        feature_ref:
          type: string
        source_ref:
          type: string
        reason:
          type: string
      additionalProperties: false

  coverage:
    type: object
    required: [source_items_in, source_items_traceable_out]
    properties:
      source_items_in:
        type: integer
        minimum: 0
      source_items_traceable_out:
        type: integer
        minimum: 0
    additionalProperties: false

  valid:
    type: boolean
    description: "是否通过来源可追溯与对齐检查"

additionalProperties: false
