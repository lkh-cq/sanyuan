# Meta Normalization Schema
# 元信息归一化结果 M_T

$schema: "https://json-schema.org/draft-07/schema#"
title: MetaView
description: "元信息任务视图: 元信息空间独立归一化结果"

type: object
required:
  - representation_id
  - boundary_id
  - observation_system
  - axes
  - route_code
  - continuous_signal
  - preserved_features
  - omitted_features
  - recovery_refs
  - loss
  - valid

properties:
  representation_id:
    type: string
    pattern: "^mt_\\d{8}_\\d{3}$"

  boundary_id:
    type: string
    description: "关联的任务边界ID"

  observation_system:
    type: string
    enum: [meta]

  origin:
    type: string
    description: "元空间原点描述"

  axes:
    type: array
    items:
      type: string
      enum: [tiancai, dicai, rencai]
    minItems: 1

  route_code:
    type: string
    description: "离散路由码 q_M (元卦)"
    pattern: "^[01]{3}$"

  continuous_signal:
    type: object
    description: "连续信号分数 s_M"
    properties:
      tiancai:
        type: number
        minimum: 0
        maximum: 1
      dicai:
        type: number
        minimum: 0
        maximum: 1
      rencai:
        type: number
        minimum: 0
        maximum: 1

  source_node_refs:
    type: array
    description: "三才藏节点引用"
    items:
      type: string

  preserved_features:
    type: array
    items:
      type: string

  omitted_features:
    type: array
    items:
      type: string

  recovery_refs:
    type: array
    description: "被删特征的恢复路径"
    items:
      type: string

  loss:
    type: object
    required: [structural, functional]
    properties:
      structural:
        type: number
        minimum: 0
        maximum: 1
      functional:
        type: number
        minimum: 0
        maximum: 1

  valid:
    type: boolean
    description: "是否通过功能检查"
