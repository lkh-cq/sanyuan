# 科研深度前端配方
# 项目版本读取 project-manifest.yaml；默认无损；三元停在 RAGRequestFrame，不替代下游 RAG。

recipe_id: research-frontend
name: 科研深度前端编译
description: "复杂科研任务的 RAG 前端流程。任务边界 -> 子任务隔离 -> 元/互保真归一化 -> 一致性诊断 -> 藏归引用组织 -> 注意力辅助 -> RAGRequestFrame。"

modules:
  - think-before-responding
  - task-boundary-compiler
  - task-decomposition
  - meta-normalization
  - hu-normalization
  - zang-gui-orchestrator
  - deep-conscious
  - conscious-rho
  - unconscious-theta

sequence:
  - step: 1
    module: think-before-responding
    action: "提取主题词与任务线索；不得据此删除来源"

  - step: 2
    module: task-boundary-compiler
    action: "生成 B_T：目标、保真要求、观测轴、attention focus；FilterLease 默认 CLOSED"
    output: B_T

  - step: 3
    module: task-decomposition
    action: "复杂任务拆为子任务；每个子任务独立 B_T，且 FilterLease 重新初始化为 CLOSED"
    condition: "if task_complexity > threshold"

  - step: 4
    module: meta-normalization
    action: "元信息保真对齐；不得产生默认 omitted/delete"
    input: B_T + raw_material
    output: M_T
    parallel_with: step_5

  - step: 5
    module: hu-normalization
    action: "互信息保真对齐；不得产生默认 omitted/delete"
    input: B_T + raw_relations
    output: H_T
    parallel_with: step_4

  - step: 6
    action: "跨空间一致性诊断"
    description: |
      检查 M_T 的对象引用与 H_T 的关系端点、来源和条件是否可互相定位。
      不一致时标记 unresolved/diagnostic，不自动删除另一侧信息，也不通过 recovery_ref 掩盖默认损失。
    input: M_T + H_T
    output: consistency_report

  - step: 7
    module: zang-gui-orchestrator
    action: "按需组织来源、StoreNode/MutualNode/ReadNode 引用；不得把摘要替代原始来源"

  - step: 8
    module: deep-conscious
    action: "n 位聚焦只控制当前前端展开预算；未展开来源仍保持 source_ref"

  - step: 9
    module: conscious-rho
    action: "rho 生成主注意力辅助提示；advisory only"

  - step: 10
    module: unconscious-theta
    action: "theta 生成次级注意力/扩宽提示；advisory only"

  - step: 11
    action: "前端保真验收"
    description: |
      检查项:
        - source refs 全量可追溯
        - relation refs 全量可追溯
        - unmapped/unresolved 未静默消失
        - 子任务 FilterLease 默认 CLOSED
        - rho/theta 未改变权限
        - normalization 未执行未授权 HOLD

  - step: 12
    action: "编译 RAGRequestFrame"
    output: RAGRequestFrame
    description: |
      默认包含:
        - task_id / boundary_ref
        - primary_query / secondary_axes
        - source_refs
        - normalization_refs
        - attention_hints(rho/theta, advisory only)
        - optional routing_metadata_refs
        - filter.filter_applied=false
      本配方到此结束。embedding、retrieval、rerank、generation 由外部 RAG 负责。

branch_conditions:
  - condition: "B_T.required_spaces contains time"
    action: "加载时间补充空间；不改变 source survival"
  - condition: "B_T.required_spaces contains evidence"
    action: "加载证据补充空间；不改变 source survival"
  - condition: "子任务 B_T 不同"
    action: "各子任务独立执行前端编译；权限不继承"
  - condition: "用户显式授权大批次高过滤"
    action: "转入 batch-filter 配方；必须验证 ACTIVE FilterLease，不得在本配方内自动过滤"

constraints:
  - "本配方是 RAG 前端，不是 RAG"
  - "默认 FilterLease=CLOSED"
  - "Focus is priority, not filter"
  - "Normalization is lossless alignment"
  - "rho/theta are advisory attention hints only"
  - "不得内建 retrieval/rerank/generation"
