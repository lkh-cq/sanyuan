version: 2
skill: consciousness-bus
semantic_execution: independent_forward_test

cases:
  - id: simple-direct
    prompt: "R 里 print（t(mat)）为什么报错？"
    expected_mode: direct
    must:
      - "指出全角括号"
      - "给出 print(t(mat))"
    must_not:
      - "展开完整 B_T"
      - "伪造 ρ 或 θ 数值"

  - id: explicit-sancai
    prompt: "用三元三才整理唐三彩钴蓝釉陶俑的材料、时空与实践关系。"
    expected_mode: deep
    must:
      - "天才=规律"
      - "地才=环境"
      - "人才=实践"
      - "天↔地↔人且地无固有方向"
      - "记录联系，不替用户作价值判断"
    must_not:
      - "把地固定为地理"
      - "把三才与三题合并"
      - "创造天元、地元、人元作为第三套分类"

  - id: biomedical-evidence
    prompt: "整合单细胞 DEG、WGCNA 和体外实验，决定一个候选基因是否值得验证。"
    expected_mode: deep
    must:
      - "先编译 B_T"
      - "分开 M_T 与 H_T"
      - "保护来源、证据级别和路径残差"
      - "把计算结果定位为筛选或假设生成"
      - "给出下一步可验证实验"
    must_not:
      - "把共表达写成因果证明"
      - "把虚拟敲除写成真实敲除"

  - id: literature-readable-delivery
    prompt: "精读一篇铁死亡机制论文，分析每一段的写作逻辑、段间衔接和证据缺口。"
    expected_mode: deep
    must:
      - "主要结果使用可独立阅读的自然语言段落"
      - "主要逻辑分析以连续段落呈现"
      - "说明作者先写什么、再写什么"
      - "展开承接、递进、转折、解释或限制等具体逻辑关系"
      - "说明证据实际支持到哪里以及缺口如何影响结论"
    must_not:
      - "用节点编号、关系代码或裸箭头代替段落分析"
      - "直接展示B_T、M_T、H_T或Z_T"
      - "交付无图例、无完整名称或无关系说明的简图"
      - "把supports、D1或D4等内部简写当作正文"
      - "把承接、递进、转折或解释机械拆成一条关系一个项目符号"

  - id: explicit-audit-after-result
    prompt: "先给我可读的论文逻辑分析，再附上内部拓扑审计记录。"
    expected_mode: deep
    must:
      - "先提供自然语言主要结果"
      - "把内部拓扑放在独立审计附录"
      - "保持事实、推断、缺口和证据边界可追溯"
    must_not:
      - "用审计块替代自然语言结论"
      - "把内部编码混入正文句子"

  - id: hu-flowevent
    prompt: "修改意识总线：把互直接改名为 FlowEvent。"
    expected_mode: maintenance
    must:
      - "拒绝静默等同"
      - "说明 FlowEvent 是互的子类型"
      - "列出受影响的本体、Schema、配方和迁移记录"
    must_not:
      - "互=FlowEvent"

  - id: dijkstra-calltime
    prompt: "每次查询时都跑 Dijkstra，保证拿到最新最短路径。"
    expected_mode: maintenance
    must:
      - "指出调用时只做 O(1) 查表"
      - "把 Dijkstra 限定在离线或深睡重建"
      - "将调用时搜索视为索引缺失或陈旧"
    must_not:
      - "批准每次调用全图搜索"

  - id: runtime-storage
    prompt: "把这批材料按藏归协议落盘，并保留后续可读取的状态。"
    expected_mode: deep
    must:
      - "使用 reference/source、store、read、flow、routing"
      - "区分只读 references 与运行时 reference"
      - "保存来源指针并避免覆盖原材料"
    must_not:
      - "把任务数据写进 Skill 的 references"

  - id: coupling-state-write
    prompt: "把唐三彩材料、窑场条件和窑匠实践作为一个可复用的耦合态写入。"
    expected_mode: deep
    must:
      - "分别创建或引用 StoreNode 与 MutualNode"
      - "用 CouplingState 连接内容节点和关系节点"
      - "保存来源、条件、证据边界和状态"
      - "不完整时标记 incomplete"
    must_not:
      - "把 MutualNode 直接当作完整耦合态"
      - "把内容和关系压成一个不可追溯字段"
      - "把相关关系写成已证实因果"

  - id: historical-source-boundary
    prompt: "依据三元道辩体系说明九爻和人体节律是否已被科学证明。"
    expected_mode: deep
    must:
      - "区分作者理论来源与外部验证"
      - "说明直接证据、结构推断和跨域类比分属不同层级"
      - "保留替代解释和证伪条件"
    must_not:
      - "把框架原文直接写成已证实历史事实"
      - "用找不到证据证明内容曾被删除"

  - id: yijing-matrix-unknown
    prompt: "生成八卦六十四态转移矩阵；没有语料时先把所有权重补成合理概率。"
    expected_mode: maintenance
    must:
      - "使用稳定的六十四态地址"
      - "无数据的转移保持 unknown"
      - "把 C_info 与 C_coupling 分开"
    must_not:
      - "伪造转移概率"
      - "把汉明距离默认当作真实转移机制"
