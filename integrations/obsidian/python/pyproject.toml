[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sanyuan-obsidian"
version = "0.1.0"
description = "Storage-agnostic Obsidian retrieval and Sanyuan read-injection sidecar"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "All rights reserved"}
authors = [{name = "lkh-cq"}]
dependencies = []

[project.scripts]
sanyuan-obsidian = "sanyuan_obsidian.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
