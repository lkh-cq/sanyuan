name: Validate and tag skill bundle

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check PyYAML
      - run: python scripts/validate_bundle.py

  tag:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Read project version
        id: version
        shell: bash
        run: |
          version="$(python - <<'PY'
          from pathlib import Path

          lines = Path('references/project-manifest.yaml').read_text(encoding='utf-8').splitlines()
          in_project = False
          for line in lines:
              if line == 'project:':
                  in_project = True
                  continue
              if in_project and line and not line.startswith((' ', '\t')):
                  break
              if in_project and line.startswith('  version:'):
                  print(line.split(':', 1)[1].strip().strip('"\x27'))
                  break
          else:
              raise SystemExit('project.version not found')
          PY
          )"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Create immutable release tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          tag="v${VERSION}"
          git fetch --tags --force
          if git rev-parse --verify "refs/tags/${tag}" >/dev/null 2>&1; then
            tagged_commit="$(git rev-list -n 1 "${tag}")"
            if [ "$tagged_commit" != "$GITHUB_SHA" ]; then
              echo "${tag} already points to ${tagged_commit}; bump project.version before publishing."
              exit 1
            fi
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "Release $tag"
          git push origin "$tag"

  cleanup-merged-agent-branches:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Delete only merged agent branches
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          git fetch origin '+refs/heads/*:refs/remotes/origin/*' --prune
          while IFS= read -r remote_ref; do
            branch="${remote_ref#origin/}"
            [ "$branch" = "$remote_ref" ] && continue
            case "$branch" in
              agent/*) ;;
              *) continue ;;
            esac
            git merge-base --is-ancestor "$remote_ref" "$GITHUB_SHA" || continue
            curl --fail-with-body --silent --show-error \
              --request DELETE \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/refs/heads/${branch}"
          done < <(git for-each-ref --format='%(refname:short)' refs/remotes/origin/agent/)
